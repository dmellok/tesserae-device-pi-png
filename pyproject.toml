[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesserae-pi-png-client"
version = "0.1.1"
description = "Raspberry Pi daemon that subscribes to a Tesserae server over MQTT and paints PNG frames onto a Pimoroni e-ink panel via the inky library."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Tesserae" }]
dependencies = [
    "paho-mqtt>=2.0,<3",
    "Pillow>=10,<12",
    # transports/rest.py uses requests for HTTP polling. inky already pulls
    # it transitively today, but list it explicitly so the dep tree doesn't
    # depend on inky's chain to satisfy a module we import directly.
    "requests>=2.31",
    # set_image() is the high-level entry point — no private-API dependency,
    # so we can take a range rather than the exact pin the bin client uses.
    "inky[rpi]>=2.0,<3",
    # relay_crypto.py: X25519 + HKDF-SHA256 + AES-256-GCM for the cloud-relay
    # transport, pinned to docs/relay/contract.md's golden vectors.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
tesserae-pi-png-client = "tesserae_pi_png_client.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
# Contract modules — strict.
module = [
    "tesserae_pi_png_client.config",
    "tesserae_pi_png_client.transforms",
    "tesserae_pi_png_client.heartbeat",
    "tesserae_pi_png_client.mqtt_loop",
    "tesserae_pi_png_client.transports.rest",
    # Added for firmware parity — same bar as the rest.
    "tesserae_pi_png_client.button_report",
    "tesserae_pi_png_client.collection",
    "tesserae_pi_png_client.deck",
    "tesserae_pi_png_client.frame_cache",
    "tesserae_pi_png_client.ota_report",
    "tesserae_pi_png_client.png_frame",
    "tesserae_pi_png_client.relay_crypto",
    "tesserae_pi_png_client.transports.sse",
]
strict = true

[[tool.mypy.overrides]]
# Hardware-touching paths — defaults.
module = [
    "tesserae_pi_png_client.paint",
    "tesserae_pi_png_client.main",
    "tesserae_pi_png_client.buttons",
    "tesserae_pi_png_client.environment",
    "tesserae_pi_png_client.transports.mqtt",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Imported lazily and only on a Pi; none of them ship stubs.
module = [
    "paho.*", "inky.*", "PIL.*", "requests.*",
    "gpiod.*", "gpiodevice.*", "smbus2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
